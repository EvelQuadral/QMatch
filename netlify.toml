[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Aligné sur la version installée en local (Node 22 LTS « Jod »), pour que le
  # build Netlify soit identique à celui qu'on valide sur le poste. Node 20 est
  # sorti de support en 2026 : ne pas y revenir.
  NODE_VERSION = "22"

# SPA routing : toutes les routes renvoient sur index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache long pour les assets, court pour le HTML
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
